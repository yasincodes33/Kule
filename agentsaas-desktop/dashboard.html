<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Kule — Ana Ekran</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #14120f;
    color: #e8e2d6;
    font-family: ui-monospace, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid #2a251d;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-size: 14px; margin: 0; letter-spacing: .02em; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #a39c8d; text-transform: uppercase; letter-spacing: .05em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #8a8478; }
  .dot.connected { background: #7dd39a; box-shadow: 0 0 6px #7dd39a; }
  .dot.connecting { background: #e8a33d; box-shadow: 0 0 6px #e8a33d; }
  button.link {
    background: none;
    border: none;
    color: #e8a33d;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    padding: 4px 8px;
  }
  button.link:hover { text-decoration: underline; }
  #list { flex: 1; overflow-y: auto; padding: 8px; }
  .empty { color: #6b6558; text-align: center; margin-top: 60px; font-size: 12.5px; line-height: 1.6; }
  .task-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: #1d1a15;
    border: 1px solid #2a251d;
    border-radius: 6px;
    cursor: pointer;
  }
  .task-row:hover { border-color: #e8a33d; }
  .task-main { min-width: 0; }
  .task-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-sub { color: #8a8478; font-size: 11px; margin-top: 2px; }
  .badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 3px 8px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge.preparing { background: #3a3220; color: #e8a33d; }
  .badge.waiting { background: #24344a; color: #7ea6e8; }
  .badge.completed { background: #1f3a2a; color: #7dd39a; }
  .badge.failed { background: #3a1f1f; color: #e07a5f; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🗼</span>
      <h1>Kule Runner</h1>
      <span class="status"><span id="status-dot" class="dot"></span><span id="status-text">Bağlı değil</span></span>
    </div>
    <button class="link" id="settings-btn">Ayarlar</button>
  </header>
  <div id="list">
    <div class="empty" id="empty-state">Henüz görev yok.<br>Bir görev bu runner'a dağıtıldığında burada görünecek.</div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
