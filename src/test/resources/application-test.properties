# Entegrasyon testleri icin veritabani ayari.
#
# Testler gelistirme veritabanina yazmamalidir: varsayilan baglanti, docker-compose'daki
# konteynerin 5433 portudur (bkz. docker/docker-compose.yml). Calistirmadan once:
#   docker compose -f docker/docker-compose.yml up -d postgres
#
# Baglanti rolu bilincli olarak SUPERUSER DEGIL: PostgreSQL superuser rolleri Row Level
# Security politikalarini baypas eder ve izolasyon testi sessizce anlamsizlasir
# (bkz. docker/init/01-test-role.sql).
#
# Farkli bir ortamda (ornegin CI) baglanti TEST_DB_* ortam degiskenleriyle degistirilebilir.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/agentsaas}
spring.datasource.username=${TEST_DB_USERNAME:agentsaas_app}
spring.datasource.password=${TEST_DB_PASSWORD:agentsaas}
