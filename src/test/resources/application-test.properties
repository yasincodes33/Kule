# Entegrasyon testleri icin veritabani ayari.
#
# Bu dosya, testlerin gelistirme veritabanina yazmasini engellemek icin eklendi. Onceden
# @SpringBootTest siniflari application.yml'deki varsayilan baglantiyi (localhost:5432)
# kullaniyordu. O port hem native PostgreSQL servisi hem de docker-compose konteyneri
# tarafindan dinlendigi icin testin hangi veritabanina yazdigi belirsizdi ve gercek
# gelistirme verisinin uzerine yazma riski vardi.
#
# Artik testler yalnizca docker-compose'daki konteynere (5433) baglaniyor. Calistirmadan once:
#   cd docker && docker compose up -d postgres
#
# Baglanti rolu bilincli olarak SUPERUSER DEGIL: PostgreSQL superuser rolleri Row Level
# Security politikalarini baypas eder ve RLS testi sessizce anlamsizlasir (bkz. docker/init).
spring.datasource.url=jdbc:postgresql://localhost:5433/agentsaas
spring.datasource.username=agentsaas_app
spring.datasource.password=agentsaas
