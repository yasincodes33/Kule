name: CI

# Backend test paketi ve frontend derlemesi. Postgres ile Redis gerçek servis
# konteynerleri olarak ayağa kalkar; Kafka gerekmez, backend Kafka'sız da uygulama
# context'ini açar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java 21 · Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          # application.yml'deki varsayılanlarla birebir aynı (DB_USERNAME/DB_PASSWORD
          # env override edilmezse zaten bunlar) — CI'da ekstra secret gerekmiyor.
          POSTGRES_DB: agentsaas
          POSTGRES_USER: agentsaas
          POSTGRES_PASSWORD: "1234"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend test suite
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (TypeScript · Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Type-check and build
        run: npm run build
