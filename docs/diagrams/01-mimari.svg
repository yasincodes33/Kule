  <text x="1074" y="324" text-anchor="middle" font-size="12" fill="#92400e">Claude</text>
  <text x="1074" y="346" text-anchor="middle" font-size="12" fill="#92400e">ChatGPT</text>
  <text x="1074" y="368" text-anchor="middle" font-size="12" fill="#92400e">Gemini</text>
  <text x="1074" y="390" text-anchor="middle" font-size="11" fill="#b45309">connector katmanı</text>

  <!-- Runner -->
  <rect x="220" y="570" width="760" height="150" rx="12" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="600" y="598" text-anchor="middle" font-size="16" font-weight="600" fill="#6b21a8">Yerel runner — Node.js</text>
  <text x="600" y="618" text-anchor="middle" font-size="12" fill="#7e22ce">kullanıcının kendi makinesinde çalışır, dışarıya port açmaz</text>

  <rect x="252" y="636" width="220" height="60" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
  <text x="362" y="658" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">Dosya ve git araçları</text>
  <text x="362" y="678" text-anchor="middle" font-size="11" fill="#475569">read_file, write_file, git_*</text>

  <rect x="490" y="636" width="220" height="60" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
  <text x="600" y="658" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">Komut çalıştırma</text>
  <text x="600" y="678" text-anchor="middle" font-size="11" fill="#475569">run_command · PTY oturumu</text>

  <rect x="728" y="636" width="220" height="60" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
  <text x="838" y="658" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">Ajan CLI'leri</text>
  <text x="838" y="678" text-anchor="middle" font-size="11" fill="#475569">gömülü terminalde etkileşimli</text>

  <!-- Oklar -->
  <line x1="210" y1="210" x2="330" y2="268" stroke="#64748b" stroke-width="1.6" marker-end="url(#ok)"/>
  <text x="196" y="246" font-size="11" fill="#475569">REST + WebSocket</text>

  <line x1="990" y1="210" x2="880" y2="268" stroke="#64748b" stroke-width="1.6" marker-end="url(#ok)"/>
  <text x="944" y="246" font-size="11" fill="#475569">bridge protokolü</text>

  <line x1="192" y1="385" x2="218" y2="385" stroke="#64748b" stroke-width="1.6" marker-end="url(#ok)"/>
  <line x1="980" y1="335" x2="1006" y2="335" stroke="#64748b" stroke-width="1.6" marker-end="url(#ok)"/>

  <line x1="600" y1="500" x2="600" y2="568" stroke="#64748b" stroke-width="1.6" marker-end="url(#ok)"/>
  <text x="612" y="538" font-size="11" fill="#475569">TASK_DISPATCH / TOOL_CALL · TASK_RESULT / LOG</text>

  <line x1="900" y1="570" x2="960" y2="215" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="906" y="404" font-size="11" fill="#94a3b8" transform="rotate(-80 906 404)">aynı makine</text>
</svg>
