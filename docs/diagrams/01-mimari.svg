  <text x="126" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Altyapı</text>
  <text x="126" y="330" text-anchor="middle" font-size="12" fill="#166534">PostgreSQL 18</text>
  <text x="126" y="348" text-anchor="middle" font-size="11" fill="#15803d">Row Level Security</text>
  <text x="126" y="366" text-anchor="middle" font-size="11" fill="#15803d">Flyway</text>
  <text x="126" y="400" text-anchor="middle" font-size="12" fill="#166534">Redis 7</text>
  <text x="126" y="418" text-anchor="middle" font-size="11" fill="#15803d">hız sınırı, bilet</text>
  <text x="126" y="452" text-anchor="middle" font-size="12" fill="#166534">Kafka</text>
  <text x="126" y="470" text-anchor="middle" font-size="11" fill="#15803d">task.created outbox</text>

  <!-- Bulut modelleri -->
  <rect x="1008" y="270" width="132" height="130" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
