<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">Kule — sistem mimarisi</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#64748b">Kontrol düzlemi bulutta, yürütme kullanıcının kendi makinesinde</text>

  <!-- Istemciler -->
  <rect x="60" y="100" width="300" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="210" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Web arayüzü</text>
  <text x="210" y="150" text-anchor="middle" font-size="12" fill="#475569">React 19 · TypeScript · Vite</text>
  <text x="210" y="172" text-anchor="middle" font-size="12" fill="#475569">görev oluşturma, izleme, onay</text>
  <text x="210" y="194" text-anchor="middle" font-size="12" fill="#94a3b8">:5173</text>

  <rect x="840" y="100" width="300" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="990" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Masaüstü uygulaması</text>
  <text x="990" y="150" text-anchor="middle" font-size="12" fill="#475569">Electron · gömülü PTY terminal</text>
  <text x="990" y="172" text-anchor="middle" font-size="12" fill="#475569">görev penceresi, dosya ağacı, git</text>
  <text x="990" y="194" text-anchor="middle" font-size="12" fill="#94a3b8">kullanıcının makinesi</text>

  <!-- Backend -->
  <rect x="220" y="270" width="760" height="230" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="600" y="298" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a8a">Backend — Spring Boot 4.1.1 / Java 21</text>
  <text x="600" y="318" text-anchor="middle" font-size="12" fill="#3b82f6">paket bazlı modüler monolit · :8081</text>

  <rect x="248" y="336" width="160" height="66" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="328" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">identity</text>
  <text x="328" y="378" text-anchor="middle" font-size="11" fill="#475569">JWT, organizasyon,</text>
  <text x="328" y="393" text-anchor="middle" font-size="11" fill="#475569">üyelik, roller</text>

  <rect x="424" y="336" width="160" height="66" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="504" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">task</text>
  <text x="504" y="378" text-anchor="middle" font-size="11" fill="#475569">durum makinesi,</text>
  <text x="504" y="393" text-anchor="middle" font-size="11" fill="#475569">dağıtım, loglar</text>

  <rect x="600" y="336" width="160" height="66" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="680" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">approval</text>
