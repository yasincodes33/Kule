  <text x="864" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">gateway</text>
  <text x="864" y="378" text-anchor="middle" font-size="11" fill="#475569">WebSocket köprüsü,</text>
  <text x="864" y="393" text-anchor="middle" font-size="11" fill="#475569">bridge token</text>

  <rect x="248" y="418" width="160" height="58" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="328" y="440" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">project</text>
  <text x="328" y="460" text-anchor="middle" font-size="11" fill="#475569">depo, varsayılan dal</text>

