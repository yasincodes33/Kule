  <text x="504" y="440" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">agent</text>
  <text x="504" y="460" text-anchor="middle" font-size="11" fill="#475569">connector, API anahtarı</text>

  <rect x="600" y="418" width="160" height="58" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="680" y="440" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">audit</text>
  <text x="680" y="460" text-anchor="middle" font-size="11" fill="#475569">değişmez olay kaydı</text>

  <rect x="776" y="418" width="176" height="58" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="864" y="440" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">notification</text>
  <text x="864" y="460" text-anchor="middle" font-size="11" fill="#475569">bildirim, e-posta</text>

