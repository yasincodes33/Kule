<svg viewBox="0 0 1120 540" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ok2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ok2k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1120" height="540" fill="#ffffff"/>
  <text x="560" y="38" text-anchor="middle" font-size="21" font-weight="600" fill="#0f172a">Görev durum makinesi</text>
  <text x="560" y="60" text-anchor="middle" font-size="13" fill="#64748b">Aynı geçiş kuralları hem servis katmanında hem veritabanı tetikleyicisinde uygulanır</text>

  <!-- Ana akis -->
  <rect x="60" y="120" width="150" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="135" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">QUEUED</text>

  <rect x="270" y="120" width="150" height="56" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="345" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">DISPATCHED</text>

  <rect x="480" y="120" width="150" height="56" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="555" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">RUNNING</text>

  <rect x="880" y="120" width="170" height="56" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="965" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">COMPLETED</text>
  <text x="965" y="166" text-anchor="middle" font-size="10" fill="#15803d">son durum</text>

  <!-- Onay dali -->
  <rect x="690" y="250" width="180" height="56" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="780" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">AWAITING_APPROVAL</text>

  <rect x="930" y="250" width="150" height="56" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="1005" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">REJECTED</text>
  <text x="1005" y="296" text-anchor="middle" font-size="10" fill="#b91c1c">son durum</text>

  <!-- Hata / iptal -->
  <rect x="480" y="400" width="150" height="56" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="555" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">FAILED</text>
  <text x="555" y="446" text-anchor="middle" font-size="10" fill="#b91c1c">yalnızca buradan retry</text>

  <rect x="270" y="400" width="150" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="345" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">CANCELLED</text>
  <text x="345" y="446" text-anchor="middle" font-size="10" fill="#64748b">son durum</text>

  <!-- Gecisler -->
  <line x1="210" y1="148" x2="268" y2="148" stroke="#475569" stroke-width="1.6" marker-end="url(#ok2)"/>
  <text x="239" y="110" text-anchor="middle" font-size="10" fill="#475569">runner bulundu</text>

  <line x1="420" y1="148" x2="478" y2="148" stroke="#475569" stroke-width="1.6" marker-end="url(#ok2)"/>
  <text x="449" y="110" text-anchor="middle" font-size="10" fill="#475569">başladı</text>

  <line x1="630" y1="148" x2="878" y2="148" stroke="#475569" stroke-width="1.6" marker-end="url(#ok2)"/>
  <text x="754" y="110" text-anchor="middle" font-size="10" fill="#475569">sonuç bildirildi</text>

  <path d="M600,176 L600,230 Q600,250 620,250 L688,250" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#ok2)"/>
  <text x="614" y="214" font-size="10" fill="#b45309">riskli araç çağrısı</text>

  <path d="M800,250 L800,200 Q800,176 824,176 L880,160" fill="none" stroke="#166534" stroke-width="1.6" marker-end="url(#ok2)"/>
  <text x="808" y="222" font-size="10" fill="#166534">onaylandı</text>

  <line x1="870" y1="278" x2="928" y2="278" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#ok2k)"/>
  <text x="899" y="240" text-anchor="middle" font-size="10" fill="#b91c1c">reddedildi</text>

  <path d="M555,176 L555,398" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ok2k)"/>
  <text x="566" y="330" font-size="10" fill="#b91c1c">hata ya da runner koptu</text>

  <path d="M345,176 L345,398" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ok2)"/>
  <text x="356" y="330" font-size="10" fill="#64748b">kullanıcı iptal etti</text>

  <path d="M480,428 L200,428 Q135,428 135,300 L135,178" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ok2)"/>
  <text x="148" y="418" font-size="10" fill="#475569">POST /tasks/{id}/retry</text>

  <!-- Notlar -->
  <rect x="60" y="480" width="1000" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="76" y="500" font-size="11" fill="#475569">Heartbeat'i kesilen bir runner'da asılı kalan görevler StaleDispatchScheduler tarafından FAILED'e çekilir; böylece retry ile kurtarılabilir hale gelir.</text>
  <text x="76" y="516" font-size="11" fill="#475569">Onay kapısından yalnızca bulut ajanlarının kendi kararıyla yaptığı araç çağrıları geçer: git_push ve run_command her zaman, write_file korunan yollarda riskli sayılır.</text>
</svg>
